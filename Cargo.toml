[package]
name = "akhook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ast-grep-core = "0.45"
ast-grep-language = "0.45"
clap = { version = "4", features = ["derive"] }
directories = "6"
garde = { version = "0.23", features = ["derive"] }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
